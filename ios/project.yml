name: Friends
options:
  bundleIdPrefix: com.iroll
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Friends:
    type: application
    platform: iOS
    sources:
      - path: Friends
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iroll.friends
        DEVELOPMENT_TEAM: 6U7N8MK2R5
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Friends
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: Friends/Friends.entitlements
    info:
      path: Friends/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLName: com.iroll.friends
            CFBundleURLSchemes:
              - friends
        CFBundleDisplayName: Friends
        LSApplicationQueriesSchemes:
          - tg
          - telegram
